<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Laboratorio de Autores y Presentadores | X Congreso SETAC 2026</title>
  <meta name="description" content="Vista previa interactiva para evaluar visualización de todos los autores y presentador en el buscador.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Estilos base y tema -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/setac-theme.css?v=20261025_v5">

  <style>
    /* Barra de control de la vista previa */
    .preview-mode-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f2744;
      color: #ffffff;
      padding: 10px 14px;
      margin: -14px -14px 16px -14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      border-bottom: 2px solid #0284c7;
    }
    .preview-mode-inner {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview-mode-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preview-mode-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .preview-mode-buttons::-webkit-scrollbar { display: none; }
    .btn-mode-toggle {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s ease;
    }
    .btn-mode-toggle:hover {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
    }
    .btn-mode-toggle.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2,132,199,0.45);
    }

    /* Navegación */
    .program-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .btn-back-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1b71a8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 12px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #b8daf2;
      box-shadow: 0 2px 6px rgba(27, 113, 168, 0.08);
      transition: all .2s ease;
    }
    .btn-back-hub:hover {
      background: #eaf4fb;
      color: #0f4c81;
    }

    /* Buscador fijo */
    .search-panel {
      position: sticky;
      top: 60px;
      z-index: 90;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid #b8daf2;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(27, 113, 168, 0.12);
    }
    .search-input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    .search-input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #3d6385;
    }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      border-radius: 10px;
      border: 1px solid #b8daf2;
      font-size: 13.5px;
      color: #0c2b48;
      background: #f7fbff;
      box-sizing: border-box;
      outline: none;
      transition: all .2s ease;
    }
    .search-input:focus {
      border-color: #1b71a8;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(27, 113, 168, 0.15);
    }

    /* Filtros por Salas */
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    
    .filter-chip {
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid #b8daf2;
      background: #ffffff;
      color: #35628a;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .filter-chip.active {
      background: #1b71a8;
      color: #ffffff;
      border-color: #1b71a8;
    }

    /* Contador */
    .results-count {
      font-size: 12px;
      font-weight: 700;
      color: #3d6385;
      margin: 8px 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tarjetas de Trabajos */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid #b8daf2;
      border-radius: 14px;
      padding: 13px 15px;
      box-shadow: 0 2px 8px rgba(27, 113, 168, 0.08);
      transition: all .2s ease;
    }
    .item-card:hover {
      box-shadow: 0 5px 16px rgba(27, 113, 168, 0.14);
      border-color: #1b71a8;
    }
    .item-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }
    .item-badges {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-time {
      font-size: 10.5px;
      font-weight: 800;
      background: #eaf4fb;
      color: #12517a;
      padding: 2.5px 7px;
      border-radius: 6px;
    }
    .badge-room {
      font-size: 10.5px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2.5px 7px;
      border-radius: 6px;
    }
    .badge-modality {
      font-size: 10px;
      font-weight: 800;
      padding: 2.5px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .mod-oral { background: #dbeafe; color: #1e40af; }
    .mod-poster { background: #ccfbf1; color: #0f766e; }
    .mod-curso { background: #fef3c7; color: #92400e; }
    .mod-mesa { background: #f3e8ff; color: #6b21a8; }
    .mod-conf { background: #e0e7ff; color: #3730a3; }

    .item-session {
      font-size: 11px;
      color: #517a9e;
      font-weight: 600;
    }

    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #0c2b48;
      line-height: 1.35;
      margin: 0 0 8px;
    }

    /* ESTILOS DE AUTORES Y PRESENTADOR */
    .authors-section {
      background: #f8fbfe;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 8px;
      border: 1px solid #e0effa;
      font-size: 12px;
      line-height: 1.4;
    }
    
    .presenter-highlight {
      font-weight: 800;
      color: #0f4c81;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 2px;
    }
    .presenter-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 3px;
      vertical-align: middle;
      text-decoration: none;
    }

    /* Botón desplegable para autores */
    .btn-toggle-authors {
      background: transparent;
      border: none;
      color: #0284c7;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 0 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      outline: none;
      transition: color .15s ease;
    }
    .btn-toggle-authors:hover {
      color: #0369a1;
      text-decoration: underline;
    }

    .authors-drawer {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #d0e7f7;
      color: #334155;
      font-size: 11.5px;
    }
    .authors-drawer.open {
      display: block;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer de tarjeta y códigos */
    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f0f7fd;
      padding-top: 6px;
      font-size: 11.5px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-cod-libro {
      font-weight: 800;
      color: #0f4c81;
      background: #e0f0fc;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      border: 1px solid #b8daf2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-orden-prog {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #517a9e;
      background: #ffffff;
      border-radius: 14px;
      border: 1px dashed #b8daf2;
    }
  </style>
</head>
<body>

  <!-- Capa de Marca de Agua Fija en el fondo durante el scroll (Hexágono Gigante) -->
  <div class="fixed-watermark-layer" aria-hidden="true"></div>

  <!-- BARRA DE CONTROL DE LA VISTA PREVIA -->
  <aside class="preview-mode-bar" aria-label="Controles del Laboratorio de Autores">
    <div class="preview-mode-inner">
      <div class="preview-mode-title">
        <span>🧪 MODO DE VISUALIZACIÓN DE AUTORES Y PRESENTADOR:</span>
      </div>
      <div class="preview-mode-buttons" role="radiogroup">
        <button class="btn-mode-toggle active" data-mode="desplegable">1️⃣ Botón "Ver autores" (Compacto)</button>
        <button class="btn-mode-toggle" data-mode="completo">2️⃣ Todos Directos (Subrayado + Badge)</button>
        <button class="btn-mode-toggle" data-mode="original">3️⃣ Original (Solo Presentador)</button>
      </div>
    </div>
  </aside>

  <div class="hub-container">

    <!-- Navegación y Volver -->
    <div class="program-header-nav">
      <a href="index.html" class="btn-back-hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Volver al Hub
      </a>
      <span class="congress-badge">Preview con Autores Completos</span>
    </div>

    <header class="hub-header" style="margin-bottom: 14px;">
      <h1 class="congress-title" style="font-size: 22px;">Buscador con Autores</h1>
      <p class="congress-subtitle">Búsqueda habilitada por <strong>título, autor o coautor</strong></p>
    </header>

    <!-- Selector de Días -->
    <nav class="tabs-nav" id="dayTabs" aria-label="Selector de Días">
      <button class="tab-btn active" data-dia="todos">Todos los Días</button>
      <button class="tab-btn" data-dia="Martes">Martes 27/10 (Día 1)</button>
      <button class="tab-btn" data-dia="Miércoles">Miércoles 28/10 (Día 2)</button>
      <button class="tab-btn" data-dia="Jueves">Jueves 29/10 (Día 3)</button>
      <button class="tab-btn" data-dia="Viernes">Viernes 30/10 (Día 4)</button>
    </nav>

    <!-- Panel de Búsqueda y Filtros de Sala -->
    <div class="search-panel">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, autor o coautor, código...">
      </div>

      <div class="filter-scroll" id="roomFilters">
        <button class="filter-chip active" data-room="todas">Todas las Salas</button>
        <button class="filter-chip" data-room="Auditorio 1">Auditorio 1</button>
        <button class="filter-chip" data-room="Auditorio 2">Auditorio 2</button>
        <button class="filter-chip" data-room="Auditorio 3">Auditorio 3</button>
        <button class="filter-chip" data-room="Auditorio 4">Auditorio 4</button>
        <button class="filter-chip" data-room="Foyer">Foyer (Pósters)</button>
      </div>
    </div>

    <!-- Contador de Resultados -->
    <div class="results-count">
      <span id="counterText">Cargando presentaciones...</span>
      <span id="activeFilterBadge" style="color:#1b71a8;"></span>
    </div>

    <!-- Listado de Presentaciones -->
    <main id="cardsContainer" class="cards-list"></main>

  </div>

  <!-- Carga de datos integrada enriquecida con autores -->
  <script src="js/programa_autores_data.js?v=20261025_preview1"></script>
  
  <script>
    // Variables de estado
    let currentDia = 'todos';
    let currentRoom = 'todas';
    let searchQuery = '';
    let authorDisplayMode = 'desplegable'; // 'desplegable' | 'completo' | 'original'

    const cardsContainer = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    const counterText = document.getElementById('counterText');

    function getModalityClass(mod) {
      if (mod === 'ORAL') return 'mod-oral';
      if (mod === 'POSTER') return 'mod-poster';
      if (mod === 'CURSO') return 'mod-curso';
      if (mod.includes('MESA')) return 'mod-mesa';
      if (mod.includes('CONFERENCIA')) return 'mod-conf';
      return 'mod-oral';
    }

    /**
     * Función que formatea la lista de autores resaltando al presentador
     */
    function formatAuthorsWithPresenter(allAuthorsStr, presenterStr) {
      if (!allAuthorsStr) return presenterStr || '';
      
      const presClean = (presenterStr || '').trim().toLowerCase();
      // Separar autores por coma
      const authorsList = allAuthorsStr.split(',').map(a => a.trim());
      
      const formatted = authorsList.map(author => {
        const autLower = author.toLowerCase();
        // Verificar si este autor corresponde al presentador
        const isPres = presClean && (autLower.startsWith(presClean) || autLower.includes(presClean));
        if (isPres) {
          return `<span class="presenter-highlight">${author}</span><span class="presenter-tag">🎤 Presentador</span>`;
        }
        return author;
      });

      return formatted.join(', ');
    }

    function renderItems() {
      if (!window.CONGRESO_PROGRAMA) {
        cardsContainer.innerHTML = '<div class="empty-state">No se cargaron datos del programa.</div>';
        return;
      }

      const query = searchQuery.toLowerCase().trim();

      const filtered = window.CONGRESO_PROGRAMA.filter(item => {
        // Filtro por día
        if (currentDia !== 'todos' && item.dia !== currentDia) {
          return false;
        }

        // Filtro por sala
        if (currentRoom !== 'todas') {
          if (currentRoom === 'Foyer') {
            if (item.auditorio !== 'Foyer' && item.modalidad !== 'POSTER') return false;
          } else {
            if (item.auditorio !== currentRoom) return false;
          }
        }

        // Filtro de texto (busca en título, presentador, autores completos, sesión, modalidad y códigos)
        if (query) {
          const matchTitle = (item.titulo || '').toLowerCase().includes(query);
          const matchPresenter = (item.presentador || '').toLowerCase().includes(query);
          const matchAuthors = (item.autores || '').toLowerCase().includes(query);
          const matchSession = (item.id_sesion || '').toLowerCase().includes(query);
          const matchMod = (item.modalidad || '').toLowerCase().includes(query);
          const matchIdLibro = (item.codigo_libro || item.id_resumen_libro || '').toLowerCase().includes(query) || (item.id_postulacion || '').toLowerCase().includes(query);
          if (!matchTitle && !matchPresenter && !matchAuthors && !matchSession && !matchMod && !matchIdLibro) {
            return false;
          }
        }

        return true;
      });

      counterText.textContent = `Mostrando ${filtered.length} presentaciones`;

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `
          <div class="empty-state">
            <p style="font-weight:700;margin-bottom:4px;">No se encontraron resultados</p>
            <p style="font-size:12px;margin:0;">Probá cambiando el término de búsqueda o seleccionando "Todos los días".</p>
          </div>
        `;
        return;
      }

      // Renderizar tarjetas según authorDisplayMode
      const html = filtered.map((item, idx) => {
        const modClass = getModalityClass(item.modalidad);
        const cardId = `card-auth-${idx}`;
        const totalAuthorsCount = (item.autores ? item.autores.split(',').length : 1);
        
        // Bloque central de autores según el modo elegido
        let authorsSectionHtml = '';

        if (authorDisplayMode === 'desplegable') {
          // MODO 1: Presentador visible y botón para desplegar todos
          authorsSectionHtml = `
            <div class="authors-section">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;">
                <div>
                  <span style="color:#64748b;font-size:11px;">Presentador:</span>
                  <span class="presenter-highlight">${item.presentador || 'A confirmar'}</span>
                </div>
                ${item.autores && totalAuthorsCount > 1 ? `
                  <button class="btn-toggle-authors" onclick="toggleAuthors('${cardId}')" id="btn-${cardId}">
                    👥 Ver todos (${totalAuthorsCount} autores) ▾
                  </button>
                ` : ''}
              </div>
              ${item.autores && totalAuthorsCount > 1 ? `
                <div class="authors-drawer" id="${cardId}">
                  <strong>Autores:</strong> ${formatAuthorsWithPresenter(item.autores, item.presentador)}
                </div>
              ` : ''}
            </div>
          `;
        } else if (authorDisplayMode === 'completo') {
          // MODO 2: Todos los autores visibles directamente con el presentador destacado
          authorsSectionHtml = `
            <div class="authors-section">
              <div style="color:#64748b;font-size:10.5px;font-weight:700;text-transform:uppercase;margin-bottom:2px;">Autores:</div>
              <div>${formatAuthorsWithPresenter(item.autores, item.presentador)}</div>
            </div>
          `;
        } else {
          // MODO 3: Original (Solo presentador en el pie)
          authorsSectionHtml = '';
        }

        // Pie de tarjeta
        const presenterFooterOriginal = authorDisplayMode === 'original' ? `
          <span class="item-presenter" style="font-weight:700;color:#1b71a8;display:flex;align-items:center;gap:5px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            ${item.presentador || ''}
          </span>
        ` : '<span></span>';

        return `
          <article class="item-card">
            <div class="item-top-row">
              <div class="item-badges">
                ${item.hora_inicio ? `<span class="badge-time">${item.hora_inicio} hs</span>` : ''}
                <span class="badge-room">${item.auditorio || 'Foyer'}</span>
                <span class="badge-modality ${modClass}">${item.modalidad}</span>
              </div>
              <span class="item-session">${item.dia} &bull; ${item.id_sesion || ''}</span>
            </div>
            
            <h3 class="item-title">${item.titulo}</h3>
            
            ${authorsSectionHtml}

            <div class="item-footer">
              ${presenterFooterOriginal}
              <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
                ${(item.codigo_libro || item.id_resumen_libro) && (item.codigo_libro || item.id_resumen_libro) !== 'S/ID' ? `
                  <span class="badge-cod-libro">📖 Cód. Libro: ${item.codigo_libro || item.id_resumen_libro}</span>
                ` : ''}
                <span class="badge-orden-prog" title="Número de orden en el cronograma">${item.id_programa}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');

      cardsContainer.innerHTML = html;
    }

    // Función para abrir/cerrar cajón de autores
    window.toggleAuthors = function(drawerId) {
      const drawer = document.getElementById(drawerId);
      const btn = document.getElementById(`btn-${drawerId}`);
      if (!drawer) return;
      
      const isOpen = drawer.classList.contains('open');
      if (isOpen) {
        drawer.classList.remove('open');
        if (btn) btn.innerHTML = btn.innerHTML.replace('▴', '▾').replace('Ocultar', 'Ver todos');
      } else {
        drawer.classList.add('open');
        if (btn) btn.innerHTML = btn.innerHTML.replace('▾', '▴').replace('Ver todos', 'Ocultar');
      }
    };

    // Inicialización y eventos
    document.addEventListener('DOMContentLoaded', () => {
      // Manejo de botones de modo (Laboratorio)
      const modeButtons = document.querySelectorAll('.btn-mode-toggle');
      modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          modeButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          authorDisplayMode = btn.getAttribute('data-mode');
          renderItems();
        });
      });

      // Manejo de tabs de días
      const dayButtons = document.querySelectorAll('#dayTabs .tab-btn');
      dayButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dayButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDia = btn.getAttribute('data-dia');
          renderItems();
        });
      });

      // Manejo de filtros de salas
      const roomChips = document.querySelectorAll('#roomFilters .filter-chip');
      roomChips.forEach(chip => {
        chip.addEventListener('click', () => {
          roomChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentRoom = chip.getAttribute('data-room');
          renderItems();
        });
      });

      // Buscador
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderItems();
      });

      renderItems();
    });
  </script>
</body>
</html>
