<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Buscador Completo: Autores y Resúmenes | X Congreso SETAC 2026</title>
  <meta name="description" content="Cronograma y buscador interactivo con autores completos, resúmenes y palabras clave del X Congreso SETAC Argentina.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Control de Caché para actualización inmediata en móviles -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Estilos base y tema -->

  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/setac-theme.css?v=20261027_v8">

  <style>
    /* Navegación y cabecera */
    .program-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .btn-back-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1b71a8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 12px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #b8daf2;
      box-shadow: 0 2px 6px rgba(27, 113, 168, 0.08);
      transition: all .2s ease;
    }
    .btn-back-hub:hover {
      background: #eaf4fb;
      color: #0f4c81;
    }

    /* Buscador fijo y sticky */
    .search-panel {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #b8daf2;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(27, 113, 168, 0.12);
    }
    .search-input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    .search-input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #3d6385;
    }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      border-radius: 10px;
      border: 1px solid #b8daf2;
      font-size: 13.5px;
      color: #0c2b48;
      background: #f7fbff;
      box-sizing: border-box;
      outline: none;
      transition: all .2s ease;
    }
    .search-input:focus {
      border-color: #1b71a8;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(27, 113, 168, 0.15);
    }

    /* Filtros por Salas */
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    
    .filter-chip {
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid #b8daf2;
      background: #ffffff;
      color: #35628a;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .filter-chip.active {
      background: #1b71a8;
      color: #ffffff;
      border-color: #1b71a8;
    }

    /* Contador */
    .results-count {
      font-size: 12px;
      font-weight: 700;
      color: #3d6385;
      margin: 8px 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Tarjetas de Trabajos */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: #ffffff;
      border: 1px solid #b8daf2;
      border-radius: 14px;
      padding: 13px 15px;
      box-shadow: 0 2px 8px rgba(27, 113, 168, 0.08);
      transition: all .2s ease;
    }
    .item-card:hover {
      box-shadow: 0 5px 16px rgba(27, 113, 168, 0.14);
      border-color: #1b71a8;
    }
    .item-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }
    .item-badges {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-time {
      font-size: 10.5px;
      font-weight: 800;
      background: #eaf4fb;
      color: #12517a;
      padding: 2.5px 7px;
      border-radius: 6px;
    }
    .badge-room {
      font-size: 10.5px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2.5px 7px;
      border-radius: 6px;
    }
    .badge-modality {
      font-size: 10px;
      font-weight: 800;
      padding: 2.5px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-orden {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f0f7fc;
      color: #0f4c81;
      border: 1px solid #b8daf2;
      white-space: nowrap;
    }
    .mod-oral { background: #dbeafe; color: #1e40af; }
    .mod-poster { background: #ccfbf1; color: #0f766e; }
    .mod-curso { background: #fef3c7; color: #92400e; }
    .mod-mesa { background: #f3e8ff; color: #6b21a8; }
    .mod-conf { background: #e0e7ff; color: #3730a3; }

    .item-session {
      font-size: 11px;
      color: #517a9e;
      font-weight: 600;
    }

    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #0c2b48;
      line-height: 1.35;
      margin: 0 0 7px;
    }

    /* FILA DE PERSONAS / ROLES */
    .item-people-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 12px;
    }
    .person-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      margin-right: 3px;
    }
    .person-highlight {
      font-weight: 800;
      color: #0f4c81;
    }
    .btn-action-pill {
      background: #eef6fc;
      border: 1px solid #b8daf2;
      color: #0284c7;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all .15s ease;
      outline: none;
    }
    .btn-action-pill:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* CAJONES DESPLEGABLES (AUTORES Y RESUMEN) */
    .expandable-drawer {
      display: none;
      background: #f8fbfe;
      border: 1px solid #d9ebf8;
      border-radius: 8px;
      padding: 9px 12px;
      margin: 7px 0;
      font-size: 12px;
      line-height: 1.45;
      animation: fadeIn .2s ease;
    }
    .expandable-drawer.open {
      display: block;
    }

    .author-highlight-inline {
      font-weight: 800;
      color: #0f4c81;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 2px;
    }

    .keywords-row {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #cde2f2;
      font-size: 11px;
      color: #475569;
    }
    .keyword-badge {
      display: inline-block;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 6px;
      margin: 2px 2px 2px 0;
      font-size: 10.5px;
      color: #0369a1;
      font-weight: 600;
    }

    .abstract-text {
      color: #334155;
      font-size: 11.5px;
      line-height: 1.5;
      margin: 6px 0 0;
      text-align: justify;
    }

    /* Footer de tarjeta */
    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f0f7fd;
      padding-top: 6px;
      margin-top: 4px;
      font-size: 11.5px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-cod-libro {
      font-weight: 800;
      color: #0f4c81;
      background: #e0f0fc;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      border: 1px solid #b8daf2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #517a9e;
      background: #ffffff;
      border-radius: 14px;
      border: 1px dashed #b8daf2;
    }
  </style>
</head>
<body>

  <!-- Capa de Marca de Agua Fija en el fondo durante el scroll -->
  <div class="fixed-watermark-layer" aria-hidden="true"></div>

  <div class="hub-container">

    <!-- Navegación y Volver -->
    <div class="program-header-nav">
      <a href="index.html?v=20261027_v8" class="btn-back-hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Volver al Hub
      </a>
      <a href="cronograma_general.html?v=20261027_v8" class="btn-back-hub" style="background:#eaf4fb;color:#0f4c81;border-color:#b8daf2;">🗓️ Programa a Primera Vista</a>
    </div>

    <header class="hub-header" style="margin-bottom: 14px;">
      <h1 class="congress-title" style="font-size: 22px;">Buscador y Cronograma</h1>
      <p class="congress-subtitle">Búsqueda habilitada por <strong>título, autor, coautor o código</strong></p>
    </header>

    <!-- Selector de Días con Nombre de Semana y Fecha -->
    <nav class="tabs-nav" id="dayTabs" aria-label="Selector de Días">
      <button class="tab-btn active" data-dia="todos">Todos los Días</button>
      <button class="tab-btn" data-dia="Martes">Martes 27/10 (Día 1)</button>
      <button class="tab-btn" data-dia="Miércoles">Miércoles 28/10 (Día 2)</button>
      <button class="tab-btn" data-dia="Jueves">Jueves 29/10 (Día 3)</button>
      <button class="tab-btn" data-dia="Viernes">Viernes 30/10 (Día 4)</button>
    </nav>

    <!-- Panel de Búsqueda y Filtros de Sala -->
    <div class="search-panel">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por apellido, título o código de libro...">
      </div>

      <div class="filter-scroll" id="roomFilters">
        <button class="filter-chip active" data-room="todas">Todas las Salas</button>
        <button class="filter-chip" data-room="Sala 1">Sala 1</button>
        <button class="filter-chip" data-room="Sala 2">Sala 2</button>
        <button class="filter-chip" data-room="Sala 3">Sala 3</button>
        <button class="filter-chip" data-room="Sala 4">Sala 4</button>
        <button class="filter-chip" data-room="Foyer">Foyer (Pósters)</button>
      </div>
    </div>

    <!-- Contador de Resultados -->
    <div class="results-count">
      <span id="counterText">Cargando presentaciones...</span>
      <span id="searchScopeBadge" style="color:#0284c7;font-weight:700;"></span>
    </div>

    <!-- Listado de Presentaciones -->
    <main id="cardsContainer" class="cards-list"></main>

  </div>

  <!-- Base de datos integral enriquecida con Autores, Resúmenes y Palabras Clave -->
  <script src="js/programa_autores_data.js?v=20261029_v10"></script>
  
  <script>
    // Variables de estado
    let currentDia = 'todos';
    let currentRoom = 'todas';
    let searchQuery = '';

    const cardsContainer = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    const counterText = document.getElementById('counterText');
    const searchScopeBadge = document.getElementById('searchScopeBadge');

    /**
     * Normalizador universal de texto: quita tildes, diacríticos y pasa a minúsculas
     */
    function normalizeStr(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    function getModalityClass(mod) {
      if (!mod) return 'mod-oral';
      if (mod === 'ORAL') return 'mod-oral';
      if (mod === 'POSTER') return 'mod-poster';
      if (mod === 'CURSO') return 'mod-curso';
      if (mod.includes('MESA') || mod.includes('CONVERSATORIO')) return 'mod-mesa';
      if (mod.includes('CONFERENCIA')) return 'mod-conf';
      return 'mod-oral';
    }

    /**
     * Resalta al presentador con subrayado y micrófono
     */
    function formatAuthorsWithPresenter(allAuthorsStr, presenterStr, isCollective = false) {
      if (!allAuthorsStr) return presenterStr || '';
      if (isCollective) return allAuthorsStr; // En cursos o conversatorios colectivos

      if (!presenterStr) return allAuthorsStr;

      const presNorm = normalizeStr(presenterStr).replace(/-/g, ' ');
      const stopwords = new Set(['de', 'del', 'da', 'do', 'los', 'las', 'san', 'van', 'der']);
      const presTokens = presNorm.split(/\s+/)
        .map(w => w.replace(/[^a-z0-9]/g, ''))
        .filter(w => w.length >= 3 && !stopwords.has(w));

      const authorsList = allAuthorsStr.split(',').map(a => a.trim());
      const exactMatch = authorsList.find(a => normalizeStr(a) === normalizeStr(presenterStr));
      if (exactMatch) {
        return authorsList.map(author =>
          normalizeStr(author) === normalizeStr(presenterStr)
            ? `<span class="author-highlight-inline">${author}</span> 🎤`
            : author
        ).join(', ');
      }
      
      const formatted = authorsList.map(author => {
        const autNorm = normalizeStr(author).replace(/-/g, ' ');
        const autWords = autNorm.split(/\s+/).map(w => w.replace(/[^a-z0-9]/g, ''));
        
        const isPres = presTokens.some(pt => 
          autWords.some(aw => aw === pt || (aw.startsWith(pt) && pt.length >= 4) || (pt.startsWith(aw) && aw.length >= 4))
        );

        if (isPres) {
          return `<span class="author-highlight-inline">${author}</span> 🎤`;
        }
        return author;
      });

      return formatted.join(', ');
    }

    function renderItems() {
      if (!window.CONGRESO_PROGRAMA) {
        cardsContainer.innerHTML = '<div class="empty-state">No se cargaron datos del programa.</div>';
        return;
      }

      const queryRaw = searchQuery.trim();
      const queryNorm = normalizeStr(queryRaw);
      const queryWords = queryNorm ? queryNorm.split(/\s+/).filter(w => w.length > 0) : [];

      // Cuando el usuario escribe una búsqueda, busca globalmente en todos los días
      // para evitar que se pierdan resultados por estar en la pestaña de un día puntual
      const isSearching = queryWords.length > 0;
      
      if (isSearching) {
        searchScopeBadge.textContent = currentDia === 'todos' ? '🔍 Búsqueda en todos los días' : `🔍 Buscando: "${queryRaw}" (en todos los días)`;
      } else {
        searchScopeBadge.textContent = '';
      }

      const filtered = window.CONGRESO_PROGRAMA.filter(item => {
        // Filtro por día (solo si NO se está buscando texto activamente)
        if (!isSearching && currentDia !== 'todos' && item.dia !== currentDia) {
          return false;
        }

        // Filtro por sala
        if (currentRoom !== 'todas') {
          if (currentRoom === 'Foyer') {
            if (item.auditorio !== 'Foyer' && item.modalidad !== 'POSTER') return false;
          } else {
            const itemRoom = (item.auditorio || '').replace(/^Auditorio\s*/i, 'Sala ');
            if (itemRoom !== currentRoom && item.auditorio !== currentRoom) return false;
          }
        }

        // MOTOR DE BÚSQUEDA INTELIGENTE
        if (isSearching) {
          // Campos clave normalizados
          const normTitle = normalizeStr(item.titulo);
          const normAuthors = normalizeStr(item.autores + ' ' + (item.autores_con_afiliacion || ''));
          const normPresenter = normalizeStr(item.presentador);
          const normCodLibro = normalizeStr(item.codigo_libro + ' ' + (item.id_resumen_libro || '') + ' ' + (item.id_postulacion || ''));
          const normKeywords = normalizeStr(item.palabras_clave);
          const normSession = normalizeStr(item.id_sesion + ' ' + item.modalidad);
          const normRoom = normalizeStr((item.auditorio || '').replace(/^Auditorio\s*/i, 'Sala '));
          const ordenInt = item.orden ? String(parseInt(item.orden, 10)) : '';
          const normOrden = item.orden ? `orden ${item.orden} orden ${ordenInt} #${item.orden} #${ordenInt} poster ${item.orden} poster ${ordenInt}` : '';

          // Todo el texto consolidado del trabajo
          const fullSearchBlob = `${normAuthors} ${normPresenter} ${normTitle} ${normCodLibro} ${normKeywords} ${normSession} ${normRoom} ${normOrden}`;

          // Cada palabra buscada debe coincidir
          const allWordsMatch = queryWords.every(word => fullSearchBlob.includes(word));
          if (!allWordsMatch) return false;
        }

        return true;
      });

      counterText.textContent = `Mostrando ${filtered.length} presentaciones`;

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `
          <div class="empty-state">
            <p style="font-weight:700;margin-bottom:4px;">No se encontraron resultados para "${queryRaw}"</p>
            <p style="font-size:12px;margin:0;">Verificá la ortografía del apellido o probá buscando por una palabra del título o código del libro.</p>
          </div>
        `;
        return;
      }

      // Renderizar tarjetas
      const html = filtered.map((item, idx) => {
        const modClass = getModalityClass(item.modalidad);
        const detailsDrawerId = `details-${idx}`;
        
        const mod = (item.modalidad || '').toUpperCase();
        const isCurso = mod === 'CURSO';
        const isConversatorio = mod.includes('CONVERSATORIO');
        const isMesa = mod.includes('MESA');
        const isConf = mod.includes('CONFERENCIA');
        
        const totalAuthorsCount = (item.autores ? item.autores.split(',').length : 1);

        // ROL Y ETIQUETA SEGÚN MODALIDAD
        let roleLabel = '🎤 Presentador:';
        let roleName = item.presentador || 'A confirmar';
        let isCollective = false;

        if (isCurso) {
          // Solicitud usuario: Responsable(s)
          roleLabel = '👨‍🏫 Responsable(s):';
          roleName = item.autores || item.presentador;
          isCollective = true;
        } else if (isConversatorio) {
          // Solicitud usuario: Panelistas en conversatorio colectivo
          roleLabel = '👥 Panelistas:';
          roleName = item.autores || item.presentador;
          isCollective = true;
        } else if (isMesa) {
          // Mesa Redonda: Panelista individual por presentación (el resto son coautores)
          roleLabel = '👥 Panelista:';
          roleName = item.presentador || item.autores;
          isCollective = false;
        } else if (isConf) {
          roleLabel = '🎙️ Disertante:';
          roleName = item.presentador || item.autores;
          isCollective = true;
        }

        // Limpiar coma final de roleName si la hubiera (ej: "Anacleto,")
        if (roleName) {
          roleName = roleName.replace(/,\s*$/, '').trim();
        }

        // Determinación del cajón unificado de detalles
        const showCoauthorsInDrawer = (!isCollective && item.autores && totalAuthorsCount > 1);
        const hasAbstract = Boolean(item.resumen && item.resumen.trim().length > 0);
        const hasKeywords = Boolean(item.palabras_clave && item.palabras_clave.trim().length > 0);
        const hasDetails = showCoauthorsInDrawer || hasAbstract || hasKeywords;

        // Botón único para ver detalles (Autores + Resumen juntos)
        let btnOpenText = '📄 Ver autores y resumen ▾';
        let btnCloseText = '📄 Ver autores y resumen ▴';

        if (showCoauthorsInDrawer && hasAbstract) {
          btnOpenText = '📄 Ver autores y resumen ▾';
          btnCloseText = '📄 Ver autores y resumen ▴';
        } else if (hasAbstract) {
          btnOpenText = '📄 Ver resumen ▾';
          btnCloseText = '📄 Ver resumen ▴';
        } else if (showCoauthorsInDrawer) {
          btnOpenText = `👥 Ver autores (${totalAuthorsCount}) ▾`;
          btnCloseText = `👥 Ver autores (${totalAuthorsCount}) ▴`;
        }

        // Badges de palabras clave
        const keywordsHtml = hasKeywords 
          ? item.palabras_clave.split('•').map(k => `<span class="keyword-badge">${k.trim()}</span>`).join(' ') 
          : '';

        return `
          <article class="item-card">
            <div class="item-top-row">
              <div class="item-badges">
                ${item.hora_inicio ? `<span class="badge-time">🕒 ${item.hora_inicio} hs</span>` : ''}
                <span class="badge-room">${(item.auditorio || 'Foyer').replace(/^Auditorio\s*/i, 'Sala ')}</span>
                <span class="badge-modality ${modClass}">${item.modalidad}</span>
              </div>
              <span class="item-session">${item.dia}${(item.turno && item.turno !== 'Todo el Día') ? ` (${item.turno})` : ''} &bull; ${item.id_sesion || ''}</span>
            </div>
            
            <h3 class="item-title">${item.titulo}</h3>

            <!-- Fila de personas principales con botón único de detalles -->
            <div class="item-people-row">
              <div>
                <span class="person-label">${roleLabel}</span>
                <span class="person-highlight">${roleName}</span>
              </div>
              ${hasDetails ? `
                <div>
                  <button class="btn-action-pill" onclick="toggleDrawer('${detailsDrawerId}', this, '${btnOpenText}', '${btnCloseText}')">
                    ${btnOpenText}
                  </button>
                </div>
              ` : ''}
            </div>

            <!-- Cajón Único Desplegable: Autores, Palabras Clave y Resumen -->
            ${hasDetails ? `
              <div class="expandable-drawer" id="${detailsDrawerId}">
                ${showCoauthorsInDrawer ? `
                  <div class="drawer-section" style="${(hasAbstract || hasKeywords) ? 'margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #cde2f2;' : ''}">
                    <strong style="color:#0f4c81;">👥 Autores:</strong><br>
                    <span style="display:inline-block;margin-top:3px;">
                      ${formatAuthorsWithPresenter(item.autores, item.presentador, isCollective)}
                    </span>
                  </div>
                ` : ''}
                ${hasKeywords ? `
                  <div class="keywords-row" style="margin-top:0;padding-top:0;border-top:none;margin-bottom:8px;">
                    <strong style="color:#0f4c81;">Palabras clave:</strong> ${keywordsHtml}
                  </div>
                ` : ''}
                ${hasAbstract ? `
                  <div class="drawer-section">
                    <strong style="color:#0f4c81;">📄 Resumen:</strong>
                    <p class="abstract-text" style="margin-top:4px;">${item.resumen}</p>
                  </div>
                ` : ''}
              </div>
            ` : ''}

            <!-- Footer: Código oficial del Libro (Izquierda) y Orden de exposición (Derecha) -->
            <div class="item-footer">
              ${(item.codigo_libro || item.id_resumen_libro) && (item.codigo_libro || item.id_resumen_libro) !== 'S/ID' ? `
                <span class="badge-cod-libro">📖 Cód. Libro: ${item.codigo_libro || item.id_resumen_libro}</span>
              ` : '<span></span>'}
              ${item.orden ? `
                <span class="badge-orden" title="Orden de exposición en la sesión">🏷️ Orden #${item.orden}</span>
              ` : '<span></span>'}
            </div>
          </article>
        `;
      }).join('');

      cardsContainer.innerHTML = html;
    }

    // Función universal para desplegar cajones (autores o resumen)
    window.toggleDrawer = function(drawerId, btn, textOpen, textClose) {
      const drawer = document.getElementById(drawerId);
      if (!drawer) return;
      const isOpen = drawer.classList.contains('open');
      if (isOpen) {
        drawer.classList.remove('open');
        if (btn) btn.innerHTML = textOpen;
      } else {
        drawer.classList.add('open');
        if (btn) btn.innerHTML = textClose;
      }
    };

    // Inicialización y eventos
    document.addEventListener('DOMContentLoaded', () => {
      // Tabs de días
      const dayButtons = document.querySelectorAll('#dayTabs .tab-btn');
      dayButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dayButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDia = btn.getAttribute('data-dia');
          renderItems();
        });
      });

      // Filtros de salas
      const roomChips = document.querySelectorAll('#roomFilters .filter-chip');
      roomChips.forEach(chip => {
        chip.addEventListener('click', () => {
          roomChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentRoom = chip.getAttribute('data-room');
          renderItems();
        });
      });

      // Buscador reactivo
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderItems();
      });

      renderItems();
    });
  </script>
</body>
</html>
